
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Chi tiết sản phẩm | Hải Apple Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="logo">
                HẢI <span>APPLE</span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Trang chủ</a>
                <a href="index.html#products">Sản phẩm</a>
                <a href="support.html">Hỗ trợ</a>
                <a href="orders.html">Đơn hàng</a>
            </nav>

            <a href="cart.html" class="cart-link">
                Giỏ hàng
                <span id="cart-count">0</span>
            </a>

        </div>
    </header>

    <main class="container product-detail-container">

        <div class="breadcrumb">
            <a href="index.html">Trang chủ</a>
            <span>/</span>
            <span>Chi tiết sản phẩm</span>
        </div>

        <section id="product-detail">

            <div class="loading-products">
                Đang tải thông tin sản phẩm...
            </div>

        </section>

        <section class="admin-section product-description-section">
            <h2>Thông tin sản phẩm</h2>
            <div id="product-description">
                Đang tải thông tin...
            </div>
        </section>

        <section class="admin-section product-review-section">
            <h2>Đánh giá sản phẩm</h2>

            <div id="product-reviews">
                Đang tải đánh giá...
            </div>

            <div id="review-form-container"></div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-bottom">
            <p>© 2026 Hải Apple Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/product-detail.js"></script>

</body>
</html>
