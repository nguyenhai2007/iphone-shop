
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tài khoản | Hải Apple Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="logo">
                HẢI <span>APPLE</span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Trang chủ</a>
                <a href="index.html#products">iPhone</a>
                <a href="orders.html">Đơn hàng</a>
            </nav>

            <a href="cart.html" class="cart-link">
                Giỏ hàng
                <span id="cart-count">0</span>
            </a>

        </div>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">H</div>
                <p>HẢI APPLE STORE</p>
            </div>

            <h1 id="auth-title">Đăng nhập</h1>

            <p class="auth-description" id="auth-description">
                Chào mừng bạn quay trở lại!
            </p>

            <form id="authForm">

                <div class="form-group" id="name-field" hidden>
                    <label for="name">Họ và tên</label>

                    <input type="text"
                           id="name"
                           placeholder="Nhập họ và tên">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email"
                           id="email"
                           placeholder="Nhập địa chỉ email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <input type="password"
                           id="password"
                           placeholder="Nhập mật khẩu"
                           autocomplete="current-password"
                           required>
                </div>

                <p id="auth-message" role="alert"></p>

                <button type="submit"
                        class="btn-primary auth-submit">
                    Đăng nhập
                </button>

            </form>

            <div class="auth-switch">
                <span id="switch-text">Bạn chưa có tài khoản?</span>

                <button type="button" id="toggle-auth">
                    Đăng ký ngay
                </button>
            </div>

            <a href="index.html" class="back-home">
                ← Quay lại trang chủ
            </a>

        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-bottom">
            <p>© 2026 Hải Apple Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/login.js"></script>

</body>
</html>
